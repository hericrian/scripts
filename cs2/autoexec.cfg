// autoexec.cfg - Counter-Strike 2
// Copie para: <Steam>\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\
// (o cs2-otimizar.ps1 faz isso com -Aplicar e guarda o seu autoexec antigo).
// Para o jogo ler o arquivo, adicione +exec autoexec nas opcoes de inicializacao.
// Cvar que a versao atual do jogo nao conhecer e apenas ignorada, nao quebra nada.

// --- Desempenho ---
fps_max 0                       // sem limite de FPS no jogo (use 0 se a GPU aguenta; senao algo como 300)
fps_max_ui 120                  // limite nos menus, poupa GPU/CPU fora da partida
cl_disablehtmlmotd 1            // nao carrega a pagina HTML do servidor ao entrar

// --- Rede ---
rate 786432                     // taxa maxima de dados aceita do servidor
cl_join_advertise 2             // amigos podem entrar pelo seu lobby
mm_dedicated_search_maxping 80  // ping maximo ao buscar partida (ajuste para sua regiao)

// --- Audio e conforto ---
snd_menumusic_volume 0          // sem musica no menu
snd_mapobjective_volume 0.2     // musica de bomba/objetivo mais baixa

echo "autoexec.cfg carregado"
